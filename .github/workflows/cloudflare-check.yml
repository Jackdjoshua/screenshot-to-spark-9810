name: RacQr Cloudflare build check

on:
  push:
    branches:
      - racqr/cloudflare-deployment
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Install dependencies and verify Cloudflare build
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: racqr/cloudflare-deployment

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and refresh lockfile
        run: bun install

      - name: Commit refreshed Bun lockfile if needed
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "Refresh Bun lockfile for Cloudflare build"
            git push origin HEAD:racqr/cloudflare-deployment
          fi

      - name: Generate Cloudflare Worker types
        run: bun run cf-typegen

      - name: Build RacQr for Cloudflare
        run: bun run build:cloudflare
